{% extends 'Nit/base.html' %}
{% load static %}

{% block title %}Edit Surveyor{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1><i class="fas fa-user-edit"></i> Edit Surveyor</h1>
    <p class="text-muted">Update surveyor information</p>

    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>Username <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" value="{{ surveyor.user.username }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ surveyor.user.email }}" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>Employee ID</label>
                            <input type="text" name="employee_id" class="form-control" value="{{ surveyor.employee_id|default:'' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>Department</label>
                            <input type="text" name="department" class="form-control" value="{{ surveyor.department|default:'' }}">
                        </div>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label>Assigned Ward</label>
                    <select name="ward_id" class="form-control">
                        <option value="">Select Ward (Optional)</option>
                        {% for ward in wards %}
                        <option value="{{ ward.id }}" {% if surveyor.ward_id == ward.id %}selected{% endif %}>
                            {{ ward.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" {% if surveyor.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>New Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label>Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Leave blank to keep current">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update Surveyor
                </button>
                <a href="{% url 'admin_surveyors' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<style>
    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        border: 1px solid rgba(0,0,0,0.04);
        overflow: hidden;
    }
    .card-body {
        padding: 24px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #1a2a3a;
        display: block;
        margin-bottom: 4px;
    }
    .form-control {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 8px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        outline: none;
        border-color: #1a8a7a;
        box-shadow: 0 0 0 4px rgba(26,138,122,0.08);
    }
    .form-check {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .form-check-input {
        width: 18px;
        height: 18px;
    }
    .text-danger {
        color: #e74c3c;
    }
    .text-muted {
        color: #6c757d;
    }
    hr {
        border: none;
        border-top: 1px solid rgba(0,0,0,0.06);
        margin: 20px 0;
    }
    .btn {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }
    .btn-primary {
        background: linear-gradient(135deg, #1a8a7a, #2eccb0);
        color: white;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(26,138,122,0.3);
        color: white;
    }
    .btn-secondary {
        background: #6c757d;
        color: white;
    }
    .btn-secondary:hover {
        background: #5a6268;
        color: white;
    }
    .mt-3 { margin-top: 16px; }
    .mb-3 { margin-bottom: 16px; }
    .row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -10px;
    }
    .col-md-6 {
        padding: 0 10px;
        flex: 1 1 50%;
    }
    @media (max-width: 768px) {
        .col-md-6 {
            flex: 1 1 100%;
        }
        .container {
            padding: 12px;
        }
        .card-body {
            padding: 16px;
        }
    }
</style>
{% endblock %}
