<!-- Nit/templates/Nit/shapefile_import.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Shapefile - GIS Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #0f3b5e; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: #1a8a7a;
            color: white;
        }
        .btn:hover { background: #126b5e; }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-file-import"></i> Import Shapefile</h1>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="data_id">Select Data Record</label>
                <select name="data_id" id="data_id" required>
                    <option value="">-- Select --</option>
                    {% for data in data_instances %}
                        <option value="{{ data.id }}" {% if selected_data and selected_data.id == data.id %}selected{% endif %}>
                            {{ data.corporation_name }} - Ward {{ data.ward }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="geom_type">Geometry Type</label>
                <select name="geom_type" id="geom_type" required>
                    <option value="polygon">Polygon</option>
                    <option value="point">Point</option>
                    <option value="line">Line</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="shapefile">Shapefile (ZIP Archive)</label>
                <input type="file" name="shapefile" id="shapefile" accept=".zip" required>
                <small style="color: #7a8a9a;">Upload a ZIP containing .shp, .shx, .dbf, and .prj files</small>
            </div>
            
            <button type="submit" class="btn">
                <i class="fas fa-upload"></i> Import
            </button>
        </form>
    </div>
</body>
</html>
