{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GIS Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0f3b5e;
            --secondary: #1a8a7a;
            --secondary-light: #2eccb0;
            --bg-light: #f0f4f8;
            --text-dark: #1a2a3a;
            --text-gray: #5a7a8a;
            --shadow-xl: 0 20px 60px rgba(15, 59, 94, 0.12);
            --radius-xl: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2f7 0%, #dce6f0 100%);
        }

        .login-container {
            background: white;
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary), var(--secondary-light), var(--secondary));
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            color: white; font-size: 2rem;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(26, 138, 122, 0.25);
        }
        .login-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .login-header p { color: var(--text-gray); font-size: 0.9rem; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-weight: 600; font-size: 0.85rem;
            color: var(--text-dark); margin-bottom: 6px;
        }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }
        .form-group input {
            width: 100%; padding: 12px 14px 12px 44px;
            border: 2px solid rgba(15, 59, 94, 0.06);
            border-radius: 12px; font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }
        .form-group input:focus {
            outline: none; border-color: var(--secondary);
            background: white; box-shadow: 0 0 0 4px rgba(26, 138, 122, 0.08);
        }

        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(26, 138, 122, 0.2);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(26, 138, 122, 0.3); }

        .register-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-gray); }
        .register-link a { color: var(--secondary); text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; }

        .messages { margin-bottom: 20px; }
        .message {
            padding: 12px 16px; border-radius: 12px; font-size: 0.85rem;
            display: flex; align-items: center; gap: 10px;
        }
        .message.success { background: rgba(26, 138, 122, 0.08); color: #1a7a6a; border: 1px solid rgba(26, 138, 122, 0.12); }
        .message.error { background: rgba(231, 76, 60, 0.08); color: #c0392b; border: 1px solid rgba(231, 76, 60, 0.12); }

        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; }
            .login-logo { width: 56px; height: 56px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo"><i class="fas fa-globe-americas"></i></div>
            <h1>Welcome Back</h1>
            <p>Sign in to your GIS Survey account</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</body>
</html>
