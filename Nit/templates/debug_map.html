{% extends "base.html" %}
{% load static %}

{% block title %}Building Map - Debug{% endblock %}

{% block content %}
<div style="padding: 20px;">
    <h2>Building Map - Debug Mode</h2>
    <p id="status">Loading...</p>
    <div id="map" style="height: 600px; width: 100%; border: 1px solid #ccc; background: #f0f2f5;"></div>
    <div id="debug" style="margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 200px; overflow: auto;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>
    var map;
    var debugDiv = document.getElementById('debug');
    var statusDiv = document.getElementById('status');
    
    // Function to convert Web Mercator to WGS84
    function webMercatorToWGS84(x, y) {
        var lon = (x / 20037508.34) * 180;
        var lat = (y / 20037508.34) * 180;
        lat = 180 / Math.PI * (2 * Math.atan(Math.exp(lat * Math.PI / 180)) - Math.PI / 2);
        return [lat, lon];
    }
    
    function convertCoords(coords) {
        if (Array.isArray(coords[0])) {
            return coords.map(convertCoords);
        } else if (coords.length === 2 && typeof coords[0] === 'number') {
            return webMercatorToWGS84(coords[0], coords[1]);
        }
        return coords;
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        statusDiv.textContent = 'Loading buildings...';
        
        // Fetch data from API
        fetch('/buildings-geojson/')
            .then(response => {
                if (!response.ok) throw new Error('Network error');
                return response.json();
            })
            .then(data => {
                var featureCount = data.features ? data.features.length : 0;
                statusDiv.textContent = `✅ Loaded ${featureCount} buildings`;
                debugDiv.innerHTML = 'Total features: ' + featureCount + '\n';
                
                if (featureCount === 0) {
                    debugDiv.innerHTML += '⚠️ No features found! Check your database.';
                    return;
                }
                
                // Show first feature
                if (data.features && data.features.length > 0) {
                    debugDiv.innerHTML += 'First feature: ' + JSON.stringify(data.features[0], null, 2).substring(0, 500) + '...';
                }
                
                // Create map
                map = L.map('map', {
                    zoomControl: true,
                    center: [28.6139, 77.2090],
                    zoom: 12,
                });
                
                // Add simple tile layer for background
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);
                
                // Check if we have features
                if (data.features && data.features.length > 0) {
                    // Convert coordinates if needed
                    var firstFeature = data.features[0];
                    var coordCheck = firstFeature.geometry.coordinates;
                    var isWebMercator = false;
                    
                    // Check if coordinates are in Web Mercator (large numbers)
                    if (Array.isArray(coordCheck) && coordCheck.length > 0) {
                        var firstCoord = coordCheck;
                        while (Array.isArray(firstCoord) && firstCoord.length > 0) {
                            firstCoord = firstCoord[0];
                        }
                        if (typeof firstCoord === 'number' && firstCoord > 1000000) {
                            isWebMercator = true;
                        }
                    }
                    
                    debugDiv.innerHTML += '\n\nCoordinates are in Web Mercator: ' + isWebMercator;
                    
                    // If coordinates are in Web Mercator, convert them
                    if (isWebMercator) {
                        debugDiv.innerHTML += '\n🔄 Converting coordinates from Web Mercator to WGS84...';
                        data.features.forEach(function(feature) {
                            if (feature.geometry) {
                                feature.geometry.coordinates = convertCoords(feature.geometry.coordinates);
                            }
                        });
                    }
                    
                    // Add to map
                    var layer = L.geoJSON(data, {
                        style: function(feature) {
                            return {
                                color: '#1a8a7a',
                                weight: 2,
                                opacity: 0.8,
                                fillColor: '#1a8a7a',
                                fillOpacity: 0.4
                            };
                        },
                        onEachFeature: function(feature, layer) {
                            var props = feature.properties;
                            layer.bindPopup(`
                                <strong>${props.building_name || 'Building'}</strong><br>
                                GIS ID: ${props.gis_id || 'N/A'}<br>
                                Area: ${props.area || 0} sqft
                            `);
                        }
                    }).addTo(map);
                    
                    // Fit map to buildings
                    var bounds = layer.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds.pad(0.1));
                        debugDiv.innerHTML += '\n✅ Map fitted to buildings';
                    } else {
                        debugDiv.innerHTML += '\n⚠️ Invalid bounds - buildings may be at wrong coordinates';
                        debugDiv.innerHTML += '\nBounds: ' + JSON.stringify(bounds);
                    }
                    
                    statusDiv.textContent = `✅ Displaying ${featureCount} buildings on map`;
                }
            })
            .catch(error => {
                statusDiv.textContent = '❌ Error: ' + error.message;
                debugDiv.innerHTML = 'Error: ' + error.message + '\n' + error.stack;
            });
        
        // Handle resize
        window.addEventListener('resize', function() {
            if (map) map.invalidateSize();
        });
    });
</script>
{% endblock %}
